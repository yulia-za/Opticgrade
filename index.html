<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OptiGrade Fisika v2</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OptiGrade">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/ff007f/ffffff?text=OG2">

    <style>
        :root {
            --bg-dark: #12121c; --panel-bg: #1e1e2f; --accent-neon: #00f0ff;
            --accent-pink: #ff007f; --success: #00ff88; --text-light: #e0e0e0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-dark); color: var(--text-light);
            margin: 0; padding: 20px; padding-bottom: 100px;
        }
        h2 { color: var(--accent-neon); font-size: 1.4rem; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid rgba(0,240,255,0.2); padding-bottom: 10px;}
        h3 { color: var(--accent-pink); font-size: 1.1rem; margin-bottom: 10px;}
        
        .panel {
            background-color: var(--panel-bg); padding: 20px;
            border-radius: 24px 8px 24px 8px; border-left: 6px solid var(--accent-pink);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3); margin-bottom: 20px;
        }

        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(30, 30, 47, 0.95); backdrop-filter: blur(10px);
            padding: 10px; border-radius: 30px; display: flex; gap: 5px;
            box-shadow: 0 4px 20px rgba(0,240,255,0.2); border: 1px solid rgba(0,240,255,0.3); z-index: 100;
        }
        .nav-btn {
            background: transparent; color: var(--text-light); border: none;
            padding: 10px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.9rem;
        }
        .nav-btn.active { background: var(--accent-pink); color: white; }
