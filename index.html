<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiGrade Fisika</title>
    <style>
        :root {
            --bg-dark: #12121c;
            --panel-bg: #1e1e2f;
            --accent-neon: #00f0ff;
            --accent-pink: #ff007f;
            --success: #00ff88;
            --text-light: #e0e0e0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            padding-bottom: 90px;
        }
        h2 { color: var(--accent-neon); font-size: 1.5rem; margin-top: 0; }
        
        .panel {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 24px 8px 24px 8px;
            border-left: 6px solid var(--accent-pink);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        /* Navigasi Bawah */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 47, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 30px;
            display: flex;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,240,255,0.2);
            border: 1px solid rgba(0,240,255,0.3);
            z-index: 100;
        }
        .nav-btn {
            background: transparent;
            color: var(--text-light);
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-btn.active { background: var(--accent-pink); color: white; }

        /* Input & Form */
        input[type="text"], input[type="password"], input[type="number"], textarea {
            width: 90%; padding: 12px; background: #2a2a40; border: 1px solid #3a3a50;
            color: white; border-radius: 8px; margin-bottom: 10px; font-family: inherit;
        }
        .step-row { display: flex; gap: 10px; margin-bottom: 10px; width: 100%;}
        .step-row input[type="text"] { flex-grow: 1; margin-bottom: 0;}
        .step-row input[type="number"] { width: 60px; color: var(--accent-neon); font-weight: bold; margin-bottom: 0;}
        
        button.btn-primary {
            background: linear-gradient(135deg, var(--accent-neon), #00b3cc);
            color: black; border: none; padding: 12px 24px; border-radius: 12px 4px 12px 4px;
            font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px;
        }
        button.btn-secondary {
            background: #2a2a40; color: white; border: 1px solid #3a3a50;
            padding: 12px; border-radius: 8px; cursor: pointer; width: 100%;
        }

        /* Grid Siswa */
        .student-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 20px;
        }
        .student-card {
            background: #2a2a40; border: 2px solid transparent; padding: 15px;
            border-radius: 16px; text-align: center; cursor: pointer; position: relative;
        }
        .student-card.graded { border-color: var(--success); background: rgba(0, 255, 136, 0.1); }
        .student-score { display: block; margin-top: 8px; font-size: 1.5rem; color: var(--success); font-weight: bold; }

        /* Jendela Modal Hasil AI */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: var(--panel-bg); width: 90%; max-width: 500px; padding: 25px;
            border-radius: 24px; border: 2px solid var(--accent-neon);
            max-height: 80vh; overflow-y: auto;
        }
        .ai-result-box {
            background: rgba(0, 240, 255, 0.1); padding: 15px; border-radius: 12px; margin-bottom: 15px; line-height: 1.6;
        }
        .final-score-input {
            font-size: 2rem; width: 100px !important; text-align: center;
            color: var(--success) !important; border-color: var(--success) !important; margin: 0 auto; display: block;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- HALAMAN 1: PENGATURAN & RUBRIK -->
    <div id="page-pengaturan" class="panel">
        <h2>⚙️ Pengaturan Sistem</h2>
        <label>API Key Gemini:</label>
        <input type="password" id="api-key" placeholder="AIzaSy...">
        
        <h2 style="margin-top: 20px;">📝 Rubrik Penilaian</h2>
        <div id="key-container">
            <div class="step-row">
                <input type="text" class="step-desc" placeholder="Langkah 1 (Rumus)">
                <input type="number" class="step-point" placeholder="Poin">
            </div>
        </div>
        <button class="btn-secondary" onclick="addStep()">+ Tambah Langkah</button>
        <button class="btn-primary" onclick="simpanPengaturan()">💾 Simpan Pengaturan</button>
    </div>

    <!-- HALAMAN 2: DATA KELAS -->
    <div id="page-kelas" class="panel hidden">
        <h2>👥 Data Kelas</h2>
        <p>Tempelkan daftar nama siswa:</p>
        <textarea id="input-siswa" placeholder="1. Ahmad Dani&#10;2. Budi Santoso"></textarea>
        <button class="btn-primary" onclick="simpanKelas()">Simpan & Buat Kartu</button>
    </div>

    <!-- HALAMAN 3: RUANG PINDAI -->
    <div id="page-pindai" class="panel hidden">
        <h2>📷 Ruang Pindai</h2>
        <p>Ketuk nama siswa untuk memindai jawaban.</p>
        <div id="student-container" class="student-grid"></div>
        <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="prosesKoreksi(event)">
    </div>

    <!-- MODAL HASIL AI -->
    <div id="ai-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="modal-title">Mengoreksi...</h2>
            
            <div id="loading-spinner" style="text-align:center; color: var(--accent-neon); margin: 20px 0;">
                <p>⚙️ AI sedang membaca gambar...</p>
            </div>

            <div id="modal-result" class="hidden">
                <div id="ai-analysis" class="ai-result-box"></div>
                <h3 style="text-align:center; margin-bottom: 5px;">Skor Akhir:</h3>
                <input type="number" id="final-score-val" class="final-score-input">
                <button class="btn-primary" onclick="simpanNilaiKeSiswa()" style="background: var(--success); color: black;">✅ Simpan Nilai</button>
                <button class="btn-secondary" onclick="tutupModal()" style="margin-top: 10px;">Batal</button>
            </div>
        </div>
    </div>

    <!-- NAVIGASI BAWAH -->
    <div class="bottom-nav">
        <button id="nav-pengaturan" class="nav-btn active" onclick="bukaHalaman('pengaturan')">⚙️ Rubrik</button>
        <button id="nav-kelas" class="nav-btn" onclick="bukaHalaman('kelas')">👥 Kelas</button>
        <button id="nav-pindai" class="nav-btn" onclick="bukaHalaman('pindai')">📷 Pindai</button>
    </div>

    <script>
        let daftarSiswa = [];
        let siswaTerpilih = null;

        // --- MANAJEMEN DATA LOKAL ---
        window.onload = () => {
            const dataSiswa = localStorage.getItem('optiSiswa');
            if(dataSiswa) daftarSiswa = JSON.parse(dataSiswa);
            
            const savedKey = localStorage.getItem('optiApiKey');
            if(savedKey) document.getElementById('api-key').value = savedKey;

            renderKartuSiswa();
        };

        function addStep() {
            const container = document.getElementById('key-container');
            const row = document.createElement('div');
            row.className = 'step-row';
            row.innerHTML = `<input type="text" class="step-desc" placeholder="Langkah..."><input type="number" class="step-point" placeholder="Poin">`;
            container.appendChild(row);
        }

        function simpanPengaturan() {
            localStorage.setItem('optiApiKey', document.getElementById('api-key').value.trim());
            alert("Pengaturan dan API Key berhasil disimpan!");
        }

        function simpanKelas() {
            const teks = document.getElementById('input-siswa').value;
            if(!teks.trim()) return;
            daftarSiswa = teks.split('\n').map(n => n.replace(/^[0-9.\-\s]+/, '').trim()).filter(n => n.length > 0)
                .map((nama, i) => ({ id: i, nama: nama, nilai: null }));
            localStorage.setItem('optiSiswa', JSON.stringify(daftarSiswa));
            renderKartuSiswa();
            bukaHalaman('pindai');
        }

        // --- ANTARMUKA PENGGUNA ---
        function renderKartuSiswa() {
            const container = document.getElementById('student-container');
            container.innerHTML = '';
            daftarSiswa.forEach(siswa => {
                const card = document.createElement('div');
                card.className = `student-card ${siswa.nilai !== null ? 'graded' : ''}`;
                card.innerHTML = `<div style="font-weight:bold;">${siswa.nama}</div>${siswa.nilai !== null ? `<span class="student-score">${siswa.nilai}</span>` : ''}`;
                card.onclick = () => {
                    siswaTerpilih = siswa.id;
                    document.getElementById('camera-input').click();
                };
                container.appendChild(card);
            });
        }

        function bukaHalaman(hal) {
            ['pengaturan', 'kelas', 'pindai'].forEach(h => {
                document.getElementById(`page-${h}`).classList.add('hidden');
                document.getElementById(`nav-${h}`).classList.remove('active');
            });
            document.getElementById(`page-${hal}`).classList.remove('hidden');
            document.getElementById(`nav-${hal}`).classList.add('active');
        }

        function tutupModal() {
            document.getElementById('ai-modal').classList.add('hidden');
            document.getElementById('camera-input').value = ''; // Reset input kamera
        }

        // --- LOGIKA AI (GEMINI) ---
        async function fileToGenerativePart(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve({ inlineData: { data: reader.result.split(',')[1], mimeType: file.type } });
                reader.readAsDataURL(file);
            });
        }

        async function prosesKoreksi(event) {
            const file = event.target.files[0];
            if(!file || siswaTerpilih === null) return;

            const apiKey = document.getElementById('api-key').value.trim();
            if(!apiKey) { alert("API Key belum diisi di menu Pengaturan!"); return; }

            // Buka Modal Loading
            document.getElementById('ai-modal').classList.remove('hidden');
            document.getElementById('loading-spinner').classList.remove('hidden');
            document.getElementById('modal-result').classList.add('hidden');
            document.getElementById('modal-title').innerText = `Koreksi: ${daftarSiswa[siswaTerpilih].nama}`;

            try {
                // Susun Rubrik
                let rubrik = "";
                document.querySelectorAll('.step-row').forEach((row, i) => {
                    const d = row.querySelector('.step-desc').value;
                    const p = row.querySelector('.step-point').value;
                    if(d) rubrik += `Langkah ${i+1}: ${d} (Bobot: ${p})\n`;
                });

                const prompt = `Anda asisten penilai yang ketat. Bandingkan gambar dengan rubrik ini:\n${rubrik}\n\nAturan:\n1. Cocokkan tulisan dengan rubrik.\n2. Beri poin sesuai bobot jika benar, 0 jika salah/tidak ada.\n3. Format respons Anda HARUS SEPERTI INI SAJA:\n<Rincian HTML dengan tag ul/li>\nSKOR_AKHIR: [Total Angka]`;

                const imagePart = await fileToGenerativePart(file);
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, imagePart] }] })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);

                const aiOutput = data.candidates[0].content.parts[0].text;
                
                // Pisahkan antara penjelasan HTML dan SKOR_AKHIR
                const parts = aiOutput.split('SKOR_AKHIR:');
                const analisisHTML = parts[0];
                const angkaSkor = parts.length > 1 ? parseInt(parts[1].trim()) : 0;

                // Tampilkan hasil di modal
                document.getElementById('ai-analysis').innerHTML = analisisHTML;
                document.getElementById('final-score-val').value = isNaN(angkaSkor) ? 0 : angkaSkor;

                document.getElementById('loading-spinner').classList.add('hidden');
                document.getElementById('modal-result').classList.remove('hidden');

            } catch(e) {
                alert("Gagal memproses: " + e.message);
                tutupModal();
            }
        }

        function simpanNilaiKeSiswa() {
            const skor = document.getElementById('final-score-val').value;
            daftarSiswa[siswaTerpilih].nilai = skor;
            localStorage.setItem('optiSiswa', JSON.stringify(daftarSiswa));
            renderKartuSiswa();
            tutupModal();
        }
    </script>
</body>
</html>
